<!doctype html><html><head><meta charset="utf-8"><title>px</title><style>body{background:#2b2238;color:#fff;font:12px sans-serif;margin:10px}.g{display:flex;flex-wrap:wrap;gap:6px}.c{display:flex;flex-direction:column;align-items:center;width:74px;font-size:9px}.c img{image-rendering:pixelated}.f{display:inline-block;margin:6px;padding:14px 18px;color:#3b2414;font-size:11px;image-rendering:pixelated}</style></head>
<body><div id="s" class="g"></div><div id="f"></div><script type="module">
import { SPRITES, spriteURL } from '/src/ui/px/sprites.js'; import '/src/ui/px/hollow.js';
import { FRAMES, frameStyle } from '/src/ui/px/frames.js';
const q = new URLSearchParams(location.search), only = q.get('only');
const s = document.getElementById('s');
for (const n of Object.keys(SPRITES)) { if (only && !n.match(only)) continue; if (n.startsWith('fox_') || n.startsWith('bear')) continue; const d = document.createElement('div'); d.className = 'c'; d.innerHTML = `<img src="${spriteURL(n, 3)}"><span>${n}</span>`; s.appendChild(d); }
const f = document.getElementById('f');
if (!q.get('nof')) for (const n of Object.keys(FRAMES)) { const d = document.createElement('div'); d.className = 'f'; d.style.cssText += frameStyle(n, 3) + ';min-width:90px;min-height:40px'; d.textContent = n; f.appendChild(d); }
window.__ready = 1;
</script></body></html>
