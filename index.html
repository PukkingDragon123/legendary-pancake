<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#131833" />
    <meta name="hoot-hollow-app" content="1" />
    <meta name="description" content="Hoot Hollow: a cozy sleep tracker where Pip the owl goes on adventures while you sleep." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hoot Hollow" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Hoot Hollow</title>
    <style>
      #boot { position: fixed; inset: 0; z-index: 99; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 30%, #26306a, #131833 70%); color: #ffe7a6; font-family: Georgia, serif; transition: opacity .8s ease; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot div { text-align: center; }
      #boot b { display: block; font-size: 34px; font-weight: 600; letter-spacing: -.01em; }
      #boot i { display: block; margin: 14px auto 0; width: 54px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, transparent, #ffe7a6, transparent); background-size: 200% 100%; animation: bs 1.4s linear infinite; }
      #boot svg { width: 64px; height: 64px; margin-bottom: 10px; }
      @keyframes bs { from { background-position: 200% 0 } to { background-position: -200% 0 } }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="ui"></div>
    <div id="boot"><div>
      <svg viewBox="0 0 48 48"><path d="M30 6a18 18 0 1 0 12 26A15 15 0 0 1 30 6z" fill="#ffe7a6" /></svg>
      <b>Hoot Hollow</b><i></i>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
