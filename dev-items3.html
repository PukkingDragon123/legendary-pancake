<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Furniture models</title>
  <style>
    @font-face { font-family: 'TBME Body'; src: url('/src/assets/fonts/figtree.woff2') format('woff2'); font-weight: 300 900; }
    html, body { margin: 0; background: #27313f; color: #f4eedd; font-family: 'TBME Body', monospace; }
    body { padding: 12px 14px 40px; }
    h1 { font-size: 20px; margin: 0 0 4px; color: #f1d39a; letter-spacing: 1px; }
    .sub { font-size: 12px; color: #aec8cc; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 220px), 1fr)); gap: 8px; }
    .cell { background: #1b222d; border: 2px solid #46596a; box-shadow: 3px 3px 0 #11161d; padding: 5px; }
    .cell canvas { width: 100%; display: block; image-rendering: pixelated; }
    .nm { font-size: 14px; margin-top: 4px; color: #f4eedd; }
    .meta { font-size: 11px; color: #aec8cc; margin-top: 2px; }
    .warn { color: #d9aca4; }
    #one { display: block; width: 100vw; height: 100vh; }
    body.one { padding: 0; overflow: hidden; }
    .label { position: fixed; left: 12px; top: 10px; font-size: 18px; color: #f1d39a; text-shadow: 2px 2px 0 #11161d; }
  </style>
</head>
<body>
  <script type="module" src="/src/dev/itemsglb.ts"></script>
</body>
</html>
