<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>furnC items</title>
  <style>
    @font-face { font-family: 'TBME Body'; src: url('/src/assets/fonts/TBMEGoofy-Regular.woff2') format('woff2'); }
    html, body { margin: 0; background: #27313f; color: #f4eedd; font-family: 'TBME Body', monospace; }
    body { padding: 14px 16px 40px; }
    h1 { font-size: 22px; margin: 0 0 4px; color: #f1d39a; letter-spacing: 1px; }
    h2 { font-size: 17px; margin: 22px 0 8px; color: #f1d39a; border-bottom: 2px solid #46596a; padding-bottom: 4px; }
    .sub { font-size: 13px; color: #c9b78d; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 220px), 1fr)); gap: 10px; }
    .cell { background: #1b222d; border: 2px solid #46596a; box-shadow: 0 3px 0 #1b222d; padding: 6px; }
    .pics { display: flex; gap: 4px; }
    .pics img { flex: 1; min-width: 0; width: 100%; height: auto; display: block; background: #2e3a48; }
    .cell .nm { font-size: 14px; margin-top: 5px; color: #f4eedd; }
    .cell .meta { font-size: 11px; color: #c9b78d; margin-top: 2px; }
    .fin canvas { width: 100%; image-rendering: pixelated; display: block; }
    .sw { display: inline-block; width: 12px; height: 12px; border: 1px solid #1b222d; vertical-align: middle; margin-right: 2px; }
    .r-common { color: #dccfb0; } .r-uncommon { color: #a7b788; } .r-rare { color: #86a9b0; } .r-epic { color: #b4a9c9; } .r-legendary { color: #f1d39a; }
    #one { display: block; width: 100vw; height: 100vh; }
    body.one { padding: 0; overflow: hidden; }
    .label { position: fixed; left: 12px; top: 10px; font-size: 18px; color: #f1d39a; text-shadow: 2px 2px 0 #1b222d; }
  </style>
</head>
<body>
  <script type="module" src="/src/dev/itemsc.ts"></script>
</body>
</html>
